<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Squirrel Heist — Woltco Woods</title>
<style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#0b0d0a;font-family:"Trebuchet MS",system-ui,sans-serif;color:#f4ead8;user-select:none;-webkit-user-select:none;touch-action:none}
canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none;display:none}
.panel{background:rgba(18,14,10,.62);border:1px solid rgba(255,230,190,.18);border-radius:10px;padding:10px 14px;backdrop-filter:blur(4px)}
#lvl{position:absolute;top:14px;left:14px;max-width:360px}#lvl b{font-size:18px;color:#ffd79a}#lvl div{font-size:13px;opacity:.9;margin-top:4px}
#meters{position:absolute;top:14px;right:14px;width:220px;font-size:12px}
.bar{height:9px;background:rgba(255,255,255,.12);border-radius:5px;overflow:hidden;margin:3px 0 8px}.bar i{display:block;height:100%;width:0;border-radius:5px;transition:width .08s}
#noise i{background:linear-gradient(90deg,#9fd36a,#f2c14e,#e0442c)}#detect i{background:#e0442c}
#timer{font-size:20px;text-align:right;color:#ffd79a}
#prompt{position:absolute;bottom:90px;left:50%;transform:translateX(-50%);font-size:16px;display:none;text-align:center}
#prog{width:200px;margin:6px auto 0;display:none}#prog i{background:#ffd79a}
#compass{position:absolute;top:84px;left:50%;transform:translateX(-50%);font-size:13px;text-align:center}
#arrow{display:inline-block;font-size:26px;color:#ffd79a;transition:transform .1s}
#toast{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);font-size:22px;opacity:0;transition:opacity .4s;text-align:center;text-shadow:0 2px 8px #000}
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(30,22,12,.55),rgba(5,6,4,.92));z-index:10}
.card{max-width:760px;width:92%;text-align:center}
h1{font-size:54px;margin:0;letter-spacing:2px;color:#ffe2b0;text-shadow:0 4px 0 #3a2410,0 8px 24px #000}h1 span{color:#d8402a}
.sub{opacity:.85;margin:8px 0 22px}
.levels{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:12px 16px;background:#3b2a18;color:#ffe2b0;border:1px solid #6b4a2a;min-width:120px}
button:hover:not(:disabled){background:#5a3d20}button:disabled{opacity:.35;cursor:not-allowed}
button.big{background:#d8402a;border-color:#ff7a5a;color:#fff;font-size:20px;padding:14px 34px}
.ctl{font-size:13px;opacity:.8;line-height:1.7;margin-top:16px}kbd{background:#2a2016;border:1px solid #5b4630;border-radius:4px;padding:1px 6px}
#footer{position:fixed;bottom:8px;right:12px;font-size:12px;letter-spacing:3px;opacity:.75;z-index:11;font-weight:bold}#footer i{color:#d8402a;font-style:normal}
#touch{display:none}#joy{position:fixed;left:24px;bottom:24px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.25);pointer-events:auto}
#knob{position:absolute;left:40px;top:40px;width:50px;height:50px;border-radius:50%;background:rgba(255,226,176,.5)}
#tbtns{position:fixed;right:20px;bottom:24px;display:grid;grid-template-columns:70px 70px;gap:10px;pointer-events:auto}#tbtns button{min-width:0;padding:16px 0;opacity:.85}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.168.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.168.0/examples/jsm/"}}</script>
</head><body>
<div id="hud">
 <div id="lvl" class="panel"><b id="lvlName"></b><div id="lvlObj"></div></div>
 <div id="meters" class="panel"><div id="timer"></div>NOISE<div class="bar" id="noise"><i></i></div>SPOTTED<div class="bar" id="detect"><i></i></div><div id="state" style="opacity:.8"></div></div>
 <div id="compass" class="panel"><span id="arrow">▲</span><div id="cdist"></div></div>
 <div id="prompt" class="panel"><span id="ptext"></span><div class="bar" id="prog"><i></i></div></div>
 <div id="toast"></div>
 <div id="touch"><div id="joy"><div id="knob"></div></div><div id="tbtns"><button data-k="KeyC">Climb</button><button data-k="KeyE">Use</button><button data-k="ShiftLeft">Sneak</button><button data-k="Space">Jump</button></div></div>
</div>
<div id="start" class="screen"><div class="card">
 <h1>SQUIRREL <span>HEIST</span></h1>
 <div class="sub">Wander the Woltco woods. Find the cabins. Sneak in. Steal the snacks.</div>
 <button class="big" id="play">Play</button>
 <div class="levels" id="levels"></div>
 <div class="ctl"><kbd>WASD</kbd> move · <kbd>Shift</kbd> sneak (quiet) · <kbd>Space</kbd> jump / leap off tree · <kbd>C</kbd> climb tree · <kbd>E</kbd> squeeze / chew / grab (hold) · drag mouse or <kbd>←→↑↓</kbd> camera · <kbd>R</kbd> retry · <kbd>Esc</kbd> menu</div>
</div></div>
<div id="end" class="screen" style="display:none"><div class="card"><h1 id="endT"></h1><div class="sub" id="endS"></div><button class="big" id="endBtn"></button> <button id="endMenu">Menu</button></div></div>
<div id="footer">WOLTCO<i>.</i></div>
<script type="module" src="./main.js"></script>
</body></html>
